<!-- ご提示いただいた要件に基づき、HTML5 CanvasとJavaScript(単一ファイルでそのまま動作可能)による
「恐竜の障害物ジャンプゲーム」のコード実装を作成しました。
プレイヤー（恐竜）と障害物（サボテン）の描画処理を独立した関数として切り出しているため、
見た目の変更や画像（`Image`オブジェクト）への差し替えが容易に行える設計になっています。

カスタマイズ方法
1. **プレイヤー画像の変更**: `player.draw` 関数内で `ctx.fillRect` を使用している部分を
 `ctx.drawImage(imageObj, this.x, this.y, this.width,this.height)` に差し替えることで
 画像表示に切り替えられます。

 2. **障害物のバリエーション**: `createObstacle` 関数内で幅（`width`）や高さ（`height`）に
 ランダム値を持たせたり、描画パターンを切り替えることが可能です。

プレイヤーや障害物を画像データへ変更する具体的なコード例への差し替えや、
追加機能（空飛ぶ障害物、ハイスコア記録など）の実装をご希望の際はお申し付けください。

スマホでの表示崩れ・レスポンシブ対応（画面サイズへの追従、タッチ操作の向上、画面揺れ・不要な画面ズームの防止）を実施し、Web Audio APIによる効果音（ジャンプ音・ゲームオーバー音）を追加した完全版のコードを作成しました。
修正・追加ポイント
1.  **スマホ表示の最適化**:
      - CSSの`aspect-ratio`と`width: 100%`を利用し、スマホの縦横サイズに合わせてアスペクト比を維持しながら自動伸縮するように設定しました。
      - `touch-action: manipulation` と `meta viewport` を追加し、連続タップによる不要な拡大ズームやスクロールを抑制しました。
2.  **効果音（SE）の追加**:
      - 外部音声ファイルを読み込む必要のない **Web Audio API** を採用し、ジャンプ時と衝突（ゲームオーバー）時に音を鳴らすように設定しました。
      - ブラウザの自動再生制御に対応するため、初回のタップ／キー入力のタイミングでオーディオコンテキストを起動するようにしています。

      ハイスコアの保存機能（LocalStorage）や障害物のバリエーション追加など、さらに調整したい点がありましたらお申し付けください。
-->

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <!-- スマホでの拡大防止とビューポート設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恐竜の障害物ジャンプゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            /* タッチ時のテキスト選択防止 */
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e0e0;
            font-family: sans-serif;
            touch-action: manipulation;
            /* 連打ズームの防止 */
            overflow: hidden;
            /* スクロール防止 */
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        canvas {
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            /* レスポンシブ対応: アスペクト比を保ったまま縮小 */
            width: 100%;
            height: auto;
            max-width: 800px;
            aspect-ratio: 800 / 300;
            display: block;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Web Audio API（効果音再生） ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ジャンプ音（ピヨッと上がる音）
        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // ゲームオーバー音（低く下がる音）
        function playGameOverSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- ゲーム定数・設定 ---
        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height;
        const GROUND_Y = CANVAS_HEIGHT - 20;

        let gameState = 'START';
        let score = 0;
        let animationFrameId = null;

        // --- プレイヤー（恐竜）設定 ---
        const player = {
            x: 50,
            y: GROUND_Y - 40,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -13,
            isGrounded: true,

            draw: function (ctx) {
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // 目
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 25, this.y + 8, 8, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(this.x + 29, this.y + 10, 4, 4);
            }
        };

        // --- 障害物（サボテン）管理 ---
        let obstacles = [];
        let nextSpawnTime = 0;
        let baseSpeed = 5;

        function createObstacle() {
            return {
                x: CANVAS_WIDTH,
                y: GROUND_Y - 40,
                width: 20,
                height: 40,

                draw: function (ctx) {
                    ctx.fillStyle = '#1b5e20';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillRect(this.x - 4, this.y + 10, 6, 12);
                    ctx.fillRect(this.x + this.width - 2, this.y + 15, 6, 12);
                }
            };
        }

        // --- 入力処理 ---
        function handleInput() {
            initAudio(); // 最初のタップ/操作でオーディオを有効化

            if (gameState === 'START') {
                resetGame();
                gameState = 'PLAYING';
            } else if (gameState === 'PLAYING') {
                if (player.isGrounded) {
                    player.velocityY = player.jumpPower;
                    player.isGrounded = false;
                    playJumpSound();
                }
            } else if (gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
            }
        }

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInput();
            }
        });

        // スマホタッチ操作
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        // --- ゲームリセット ---
        function resetGame() {
            score = 0;
            obstacles = [];
            player.y = GROUND_Y - player.height;
            player.velocityY = 0;
            player.isGrounded = true;
            nextSpawnTime = performance.now() + getRandomInterval();
        }

        function getRandomInterval() {
            return (1.5 + Math.random() * 1.5) * 1000;
        }

        // --- 衝突判定 ---
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // --- ループ処理 ---
        function gameLoop(timestamp) {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 地面描画
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();

            if (gameState === 'START') {
                player.draw(ctx);

                ctx.fillStyle = '#333333';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('タップまたはスペースキーで開始', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

            } else if (gameState === 'PLAYING') {
                score += 1;
                const currentSpeed = baseSpeed + Math.floor(score / 500) * 0.5;

                // プレイヤー移動
                player.velocityY += player.gravity;
                player.y += player.velocityY;

                if (player.y >= GROUND_Y - player.height) {
                    player.y = GROUND_Y - player.height;
                    player.velocityY = 0;
                    player.isGrounded = true;
                }

                player.draw(ctx);

                // 障害物生成
                if (timestamp >= nextSpawnTime) {
                    obstacles.push(createObstacle());
                    nextSpawnTime = timestamp + getRandomInterval();
                }

                // 障害物移動・衝突
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= currentSpeed;
                    obs.draw(ctx);

                    if (checkCollision(player, obs)) {
                        gameState = 'GAMEOVER';
                        playGameOverSound();
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                // スコア表示
                ctx.fillStyle = '#333333';
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${Math.floor(score)}`, CANVAS_WIDTH - 20, 35);

            } else if (gameState === 'GAMEOVER') {
                player.draw(ctx);
                obstacles.forEach(obs => obs.draw(ctx));

                ctx.fillStyle = '#333333';
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${Math.floor(score)}`, CANVAS_WIDTH - 20, 35);

                ctx.fillStyle = '#d32f2f';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 10);

                ctx.fillStyle = '#666666';
                ctx.font = '16px sans-serif';
                ctx.fillText('タップまたはスペースキーでリトライ', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 25);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    </script>

</body>

</html>
